# 날짜별 시장 제도. 근거: docs/00 0.5 "시장 구조 변화" 표. 값은 P13에서 채운다.
#
# 규칙
# - 구간은 [effective_from, effective_to)이다. effective_to: null은 "현재까지"다.
# - 같은 항목 안에서 구간이 겹치면 안 된다. 로더가 검사한다.
# - 날짜는 시행일(그날 거래부터 적용)이다. 발표일이 아니다.
# - 항목마다 source에 근거 문서나 공시 위치를 적는다.
version: 1

# 가격제한폭. R-PX-20이 날짜별 한도로 읽는다.
#   - effective_from: YYYY-MM-DD
#     effective_to: null
#     limit_ratio: null
#     source: null
price_limit: []

# 신규상장 첫날 가격 범위. 상장 첫날을 신호와 R-PX-20에서 제외하는 근거다.
#   - effective_from: YYYY-MM-DD
#     effective_to: null
#     lower_ratio: null
#     upper_ratio: null
#     source: null
ipo_first_day_band: []

# 공매도 금지 기간. 백테스터 제약으로만 쓴다.
#   - effective_from: YYYY-MM-DD
#     effective_to: YYYY-MM-DD
#     scope: null
#     source: null
short_sale_ban: []

# 거래량과 거래대금의 범위가 달라지는 시점 (대체거래소 출범, 거래 시간 변경).
# 유동성 지표를 이 날짜 전후로 나눠 분석한다.
#   - effective_from: YYYY-MM-DD
#     change: null
#     affected_fields: []
#     source: null
volume_scope_breaks: []

# 결제 주기. mart.fn_ex_date의 배당락일 규칙이 여기에 묶여 있다.
#   - effective_from: YYYY-MM-DD
#     effective_to: null
#     settlement_lag_open_days: null
#     source: null
settlement_cycle: []
